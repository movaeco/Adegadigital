<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adega Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B0B0B; --ink-soft:#3A3A3A; --ink-faint:#8A8A86;
  --paper:#FFFFFF; --panel:#FAFAF8; --line:#E4E3DF; --line-strong:#0B0B0B;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F3F3F0; --border:#E4E3DF;
  --text:#0B0B0B; --text-muted:#7A7A76; --ok:#0B0B0B;
  --radius:3px; --radius-lg:5px;
  --shadow-card:0 1px 2px rgba(11,11,11,.04);
  --shadow-lift:0 18px 30px -18px rgba(11,11,11,.35);
  --shadow-modal:0 30px 60px -20px rgba(11,11,11,.45);
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:var(--bg); color:var(--text);
  font-family:'Work Sans',system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{font-family:'Fraunces',serif;font-weight:500;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;transition:opacity .15s ease,background-color .15s ease,border-color .15s ease,transform .15s ease}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input,select,textarea{font-family:inherit;background:var(--paper);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:.65rem .75rem;font-size:.92rem;transition:border-color .15s ease}
input::placeholder,textarea::placeholder{color:var(--ink-faint)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
a{color:inherit}
img{display:block;max-width:100%}
.hide{display:none!important}

/* ---------- Customer shell ---------- */
#customer{max-width:1120px;margin:0 auto;padding:0 0 5rem}
.cust-header{
  position:sticky;top:0;z-index:10;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);
  padding:1.35rem 1.5rem 1.1rem;border-bottom:1px solid var(--line);
}
.brand-row{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;margin-bottom:1.05rem}
.brand-row h1{font-size:1.65rem;font-weight:500;letter-spacing:-.01em}
.brand-row span{font-style:italic;font-weight:400}
.count-tag{font-size:.76rem;color:var(--text-muted);white-space:nowrap;padding-top:.15rem}
.search-row{display:flex;gap:.6rem}
.search-row input{flex:1;background:var(--panel)}
.filter-toggle{border:1px solid var(--border);padding:.65rem 1rem;border-radius:var(--radius);font-size:.84rem;white-space:nowrap;background:var(--paper)}
.filter-toggle:hover{border-color:var(--ink)}
.filter-toggle.active{border-color:var(--ink);background:var(--ink);color:var(--paper)}

.filters{padding:1rem 1.5rem;border-bottom:1px solid var(--line);display:grid;gap:.85rem;grid-template-columns:1fr 1fr;background:var(--panel)}
.filters label{display:block;font-size:.72rem;color:var(--text-muted);margin-bottom:.35rem;letter-spacing:.01em}
.filters select,.filters input{background:var(--paper)}
.price-inputs{display:flex;gap:.5rem;align-items:center}
.price-inputs span{color:var(--ink-faint)}
.price-inputs input{width:100%}
.filters .full{grid-column:1/-1}
.pill-group{display:flex;flex-wrap:wrap;gap:.5rem}
.clear-filters{grid-column:1/-1;text-align:right;font-size:.8rem;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.clear-filters:hover{color:var(--ink)}

.tab-row{display:flex;gap:.5rem;overflow-x:auto;padding:.2rem .02rem;scrollbar-width:none;-ms-overflow-style:none}
.tab-row::-webkit-scrollbar{display:none}
.country-tabs{margin-top:1rem}
.tab-btn{flex:0 0 auto;padding:.55rem 1.05rem;border-radius:99px;font-size:.85rem;font-weight:500;border:1px solid var(--border);background:var(--paper);white-space:nowrap;transition:background-color .15s ease,color .15s ease,border-color .15s ease}
.tab-btn:hover{border-color:var(--ink)}
.tab-btn.active{background:var(--ink);color:#FFFFFF;border-color:var(--ink)}
.country-tabs .tab-btn{font-size:.78rem;padding:.42rem .9rem;color:var(--text-muted);border-color:var(--line)}
.country-tabs .tab-btn.active{background:var(--ink);color:#FFFFFF;border-color:var(--ink)}

.catalog{padding:1.25rem 1.5rem 1.5rem;display:flex;gap:1rem;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.catalog::-webkit-scrollbar{display:none}
.catalog .wine-card{flex:0 0 68%;scroll-snap-align:start}
@media(min-width:480px){.catalog .wine-card{flex:0 0 46%}}
@media(min-width:640px){.catalog{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;padding:1.75rem;overflow-x:visible}.catalog .wine-card{flex:unset}}
@media(min-width:900px){.catalog{grid-template-columns:repeat(4,1fr)}}
.wine-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;text-align:left;box-shadow:var(--shadow-card);transition:transform .22s cubic-bezier(.2,.7,.3,1),box-shadow .22s ease,border-color .22s ease}
.wine-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);border-color:#CFCFC9}
.wine-card .thumb{aspect-ratio:2/3;background:var(--panel);display:flex;align-items:center;justify-content:center;overflow:hidden}
.wine-card .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
.wine-card:hover .thumb img{transform:scale(1.045)}
.wine-card .info{padding:.85rem .9rem 1rem}
.cat-pill{display:inline-block;font-size:.64rem;letter-spacing:.02em;color:var(--ink-soft);border:1px solid var(--line);border-radius:99px;padding:.15rem .55rem;margin-bottom:.55rem}
.wine-card h3{font-size:1.02rem;font-weight:500;line-height:1.28;margin-bottom:.2rem}
.wine-card .origin{font-size:.79rem;color:var(--text-muted);margin-bottom:.6rem}
.wine-card .price{font-size:.96rem;font-weight:600;font-variant-numeric:tabular-nums}
.empty-state{padding:4rem 1.25rem;text-align:center;color:var(--text-muted)}
.empty-state h3{color:var(--text);font-weight:500;margin-bottom:.4rem}
.cust-footer{padding:2.2rem 1.5rem 1rem;text-align:center;border-top:1px solid var(--line);margin-top:1rem}
.cust-footer a{font-size:.78rem;color:var(--text-muted);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.cust-footer a:hover{color:var(--ink)}

/* modal */
.modal-back{position:fixed;inset:0;background:rgba(11,11,11,.78);z-index:50;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
@media(min-width:640px){.modal-back{align-items:center}}
.modal{background:var(--paper);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:var(--radius-lg);box-shadow:var(--shadow-modal)}
.modal .hero{aspect-ratio:4/3;background:var(--panel)}
.modal .hero img{width:100%;height:100%;object-fit:cover}
.modal-body{padding:1.6rem 1.6rem 2rem}
.modal-body h2{font-size:1.6rem;font-weight:500;margin-bottom:.25rem}
.modal-body .origin{color:var(--text-muted);margin-bottom:1rem;font-size:.92rem}
.modal-price{font-size:1.35rem;font-weight:600;margin-bottom:1.1rem;font-variant-numeric:tabular-nums}
.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem 1rem;margin-bottom:1.1rem;font-size:.86rem;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:.9rem 0}
.spec-grid dt{color:var(--text-muted);font-size:.72rem;letter-spacing:.02em}
.spec-grid dd{margin-top:.15rem;font-weight:500}
.modal-desc{font-size:.92rem;line-height:1.65;color:var(--ink-soft);margin-bottom:1.3rem}
.avail{display:inline-flex;align-items:center;gap:.5rem;font-size:.82rem}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.seal-tag{display:inline-flex;align-items:center;gap:.55rem;font-size:.78rem;color:var(--text-muted);margin-top:.7rem;padding-top:.7rem;border-top:1px dashed var(--line)}
.seal-dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.25);flex-shrink:0}
.close-btn{position:sticky;top:.9rem;margin-left:auto;margin-right:.9rem;display:flex;align-items:center;justify-content:center;background:rgba(11,11,11,.55);color:#FFFFFF;width:34px;height:34px;border-radius:50%;font-size:1rem;z-index:2}
.close-btn:hover{background:var(--ink)}

/* ---------- Admin shell ---------- */
#admin{max-width:1180px;margin:0 auto;padding:1.75rem 1.5rem 4rem}
.login-box{max-width:340px;margin:15vh auto;background:var(--paper);border:1px solid var(--line);padding:2.25rem;border-radius:var(--radius-lg);box-shadow:var(--shadow-card)}
.login-box h2{margin-bottom:.35rem}
.login-box p{color:var(--text-muted);font-size:.85rem;margin-bottom:1.4rem;line-height:1.5}
.login-box input{width:100%;margin-bottom:.9rem;background:var(--panel)}
.btn{background:var(--ink);color:#FFFFFF;padding:.7rem 1.2rem;border-radius:var(--radius);font-weight:600;font-size:.9rem;border:1px solid var(--ink)}
.btn:hover{background:#000000;transform:translateY(-1px)}
.btn-outline{border:1px solid var(--border);padding:.7rem 1.2rem;border-radius:var(--radius);font-size:.9rem;background:var(--paper)}
.btn-outline:hover{border-color:var(--ink)}
.btn-ghost{color:var(--text-muted);font-size:.85rem;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.btn-ghost:hover{color:var(--ink)}
.err{color:var(--text);font-weight:600;font-size:.82rem;min-height:1.2em}

.admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.6rem;flex-wrap:wrap;gap:.6rem;padding-bottom:1.1rem;border-bottom:1px solid var(--line)}
.stat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:.9rem;margin-bottom:1.8rem}
@media(min-width:720px){.stat-row{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--paper);border:1px solid var(--line);padding:1.1rem 1.2rem;border-radius:var(--radius-lg);box-shadow:var(--shadow-card)}
.stat .n{font-family:'Fraunces',serif;font-size:2rem;font-weight:500}
.stat .l{font-size:.78rem;color:var(--text-muted);margin-top:.1rem}
.admin-toolbar{display:flex;justify-content:space-between;gap:.7rem;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.admin-toolbar input{min-width:220px;background:var(--panel)}
table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
th,td{padding:.8rem .9rem;text-align:left;font-size:.85rem;border-bottom:1px solid var(--line)}
th{color:var(--text-muted);font-weight:500;font-size:.72rem;letter-spacing:.02em;background:var(--panel)}
tr:last-child td{border-bottom:none}
tbody tr{transition:background-color .15s ease}
tbody tr:hover{background:var(--panel)}
.row-name{display:flex;align-items:center;gap:.7rem}
.row-thumb{width:36px;height:46px;object-fit:cover;background:var(--panel);border-radius:var(--radius);border:1px solid var(--line)}
.stock-ctrl{display:inline-flex;align-items:center;gap:.5rem}
.stock-ctrl button{width:24px;height:24px;border:1px solid var(--border);border-radius:var(--radius);background:var(--paper)}
.stock-ctrl button:hover{border-color:var(--ink);background:var(--ink);color:#FFFFFF}
.badge{font-size:.7rem;padding:.2rem .55rem;border-radius:99px}
.badge.on{color:#FFFFFF;background:var(--ink);border:1px solid var(--ink)}
.badge.off{color:var(--text-muted);border:1px solid var(--border)}
.row-actions{display:flex;gap:.6rem;font-size:.78rem}
.row-actions button{text-decoration:underline;text-underline-offset:3px;color:var(--text-muted);text-decoration-color:var(--line)}
.row-actions button:hover{color:var(--ink)}
.tbl-wrap{overflow-x:auto;border-radius:var(--radius-lg)}

/* form modal */
.form-modal{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:var(--radius-lg);padding:1.75rem;box-shadow:var(--shadow-modal)}
.form-modal h2{margin-bottom:1.1rem}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:.85rem}
.f-grid .full{grid-column:1/-1}
.f-grid label{display:block;font-size:.75rem;color:var(--text-muted);margin-bottom:.35rem}
.f-grid input,.f-grid select,.f-grid textarea{width:100%;background:var(--panel)}
.photo-pick{display:flex;align-items:center;gap:.9rem}
.photo-pick img{width:64px;height:64px;object-fit:cover;border-radius:var(--radius);border:1px solid var(--line);flex-shrink:0}
.photo-pick input[type=file]{flex:1;font-size:.8rem}
.toggle-row{display:flex;align-items:center;gap:.6rem;margin-top:.4rem}
.form-actions{display:flex;justify-content:flex-end;gap:.7rem;margin-top:1.5rem;padding-top:1.2rem;border-top:1px solid var(--line)}

/* settings */
.admin-nav{display:flex;gap:.4rem;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:.25rem}
.admin-nav button{padding:.5rem 1.05rem;border-radius:99px;font-size:.84rem;font-weight:500;color:var(--text-muted)}
.admin-nav button.active{background:var(--ink);color:#FFFFFF}
.settings-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);padding:1.4rem;margin-bottom:1.2rem;box-shadow:var(--shadow-card)}
.settings-card h2{font-size:1.15rem;margin-bottom:.2rem}
.settings-card .hint{color:var(--text-muted);font-size:.82rem;margin-bottom:1.1rem}
.settings-row{display:flex;gap:.6rem;align-items:center;margin-bottom:.6rem}
.settings-row input{flex:1;background:var(--panel)}
.settings-row .price-label{flex:2}
.settings-row .price-num{flex:1}
.settings-row .icon-del{width:34px;height:34px;flex:0 0 auto;border:1px solid var(--border);border-radius:var(--radius);color:var(--text-muted);font-size:.95rem}
.settings-row .icon-del:hover{border-color:var(--ink);color:var(--ink);background:var(--panel)}
.settings-add{display:flex;gap:.6rem;margin-top:.9rem;padding-top:.9rem;border-top:1px dashed var(--line)}
.settings-add input{flex:1;background:var(--panel)}

/* share modal */
.share-modal{max-width:420px;text-align:center}
.share-modal .hint{color:var(--text-muted);font-size:.82rem;margin-top:.3rem}
.share-link-row{display:flex;gap:.6rem;margin:1.1rem 0}
.share-link-row input{flex:1;background:var(--panel);font-size:.82rem}
.share-qr{display:flex;justify-content:center;margin-bottom:.3rem}
.share-qr img{border:1px solid var(--line);border-radius:var(--radius)}
</style>
</head>
<body>

<div id="customer"></div>
<div id="admin" class="hide"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, doc, collection, setDoc, deleteDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

/* ---------------- banco de dados (Firebase) ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyA3YeXa0WIv3Oa9Pojtv8HtJj_jYYTd5_c",
  authDomain: "adegadigital-369f7.firebaseapp.com",
  projectId: "adegadigital-369f7",
  storageBucket: "adegadigital-369f7.firebasestorage.app",
  messagingSenderId: "941296252619",
  appId: "1:941296252619:web:f2b0410e9e0f0ad50fcd4e"
};
const fbApp=initializeApp(firebaseConfig);
const db=getFirestore(fbApp);
const winesColl=collection(db,'wines');
const legacyWinesRef=doc(db,'adega','wines');
const settingsRef=doc(db,'adega','settings');
let dbReady=false,winesLoaded=false,settingsLoaded=false,dbError=null,migrating=false;

/* ---------------- data layer ---------------- */
const ADMIN_PASS='adega2026';
/* Identifica computador (mouse/trackpad) vs celular/tablet (toque). Não muda com o tamanho da janela. */
const IS_DESKTOP=window.matchMedia('(hover:hover) and (pointer:fine)').matches;

const seed=[
 {id:1,name:'Reserva Cabernet Sauvignon',image:'https://images.unsplash.com/photo-1553361371-9b22f78e8b1d?w=600',price:89,country:'Chile',region:'Vale de Colchagua',grape:'Cabernet Sauvignon',category:'Tinto',description:'Encorpado, com taninos macios e notas de frutas escuras e especiarias.',stock:7,active:true,colorCode:'Vermelho',abv:13.5,sweetness:'Seco'},
 {id:2,name:'Malbec Alta Vista',image:'https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?w=600',price:112,country:'Argentina',region:'Mendoza',grape:'Malbec',category:'Tinto',description:'Aromas intensos de ameixa e violeta, final longo e aveludado.',stock:4,active:true,colorCode:'Azul',abv:13.8,sweetness:'Seco'},
 {id:3,name:'Douro Branco Colheita',image:'https://images.unsplash.com/photo-1584916201218-f4242ceb4809?w=600',price:76,country:'Portugal',region:'Douro',grape:'Viosinho',category:'Branco',description:'Fresco e mineral, com acidez viva e notas cítricas.',stock:9,active:true,colorCode:'Dourado',abv:12.5,sweetness:'Seco'},
 {id:4,name:'Chianti Classico',image:'https://images.unsplash.com/photo-1547595628-c61a29f496f0?w=600',price:134,country:'Itália',region:'Toscana',grape:'Sangiovese',category:'Tinto',description:'Elegante e estruturado, com notas de cereja e ervas secas.',stock:0,active:true,colorCode:'Preto',abv:13.5,sweetness:'Seco'},
 {id:5,name:'Rosé de Provence',image:'https://images.unsplash.com/photo-1558346490-a72e53ae2d4f?w=600',price:98,country:'França',region:'Provence',grape:'Grenache',category:'Rosé',description:'Leve e seco, com notas de frutas vermelhas e flores brancas.',stock:6,active:true,colorCode:'Amarelo',abv:12,sweetness:'Meio Seco'},
 {id:6,name:'Espumante Brut Nature',image:'https://images.unsplash.com/photo-1470158499416-75be9aa0c4db?w=600',price:145,country:'Brasil',region:'Serra Gaúcha',grape:'Chardonnay',category:'Espumante',description:'Borbulhas finas e persistentes, elegante e seco.',stock:5,active:true,colorCode:'Prata',abv:12.5,sweetness:'Seco'},
 {id:7,name:'Pinot Noir Central Otago',image:'https://images.unsplash.com/photo-1596363505729-4190a9506133?w=600',price:168,country:'Nova Zelândia',region:'Central Otago',grape:'Pinot Noir',category:'Tinto',description:'Delicado e perfumado, com taninos sedosos e acidez equilibrada.',stock:3,active:true,colorCode:'Vermelho',abv:13,sweetness:'Seco'},
 {id:8,name:'Chardonnay Reserva',image:'https://images.unsplash.com/photo-1568213816046-0a1d65c78f43?w=600',price:82,country:'Chile',region:'Casablanca',grape:'Chardonnay',category:'Branco',description:'Amanteigado e cremoso, com notas de baunilha e frutas tropicais.',stock:2,active:false,colorCode:'Amarelo',abv:13.2,sweetness:'Seco'},
];

let wines=structuredClone(seed);
function saveWine(w){setDoc(doc(winesColl,String(w.id)),w).catch(e=>console.error('Erro ao salvar vinho no banco:',e));}
function deleteWineDoc(id){return deleteDoc(doc(winesColl,String(id)));}
function nextId(){return wines.length?Math.max(...wines.map(w=>w.id))+1:1;}
function fmtPrice(p){return 'R$ '+Number(p).toFixed(2).replace('.',',');}

const DEFAULT_SETTINGS={
  categories:['Tinto','Branco','Rosé','Espumante'],
  priceRanges:[
    {label:'Até R$ 50',min:'',max:'50'},
    {label:'R$ 50 – 100',min:'50',max:'100'},
    {label:'R$ 100 – 200',min:'100',max:'200'},
    {label:'Acima de R$ 200',min:'200',max:''},
  ],
};
let settings=structuredClone(DEFAULT_SETTINGS);
function saveSettings(){setDoc(settingsRef,settings).catch(e=>console.error('Erro ao salvar configurações no banco:',e));}

/* Redimensiona e comprime a foto no próprio aparelho, sem precisar de upload — vira parte do vinho salvo direto no banco. */
function resizeImage(file,maxDim,quality){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('Não foi possível ler o arquivo.'));
    reader.onload=e=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('Arquivo não é uma imagem válida.'));
      img.onload=()=>{
        let{width,height}=img;
        if(width>height){if(width>maxDim){height=Math.round(height*maxDim/width);width=maxDim;}}
        else{if(height>maxDim){width=Math.round(width*maxDim/height);height=maxDim;}}
        const canvas=document.createElement('canvas');
        canvas.width=width;canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* Mantém o app sincronizado em tempo real: qualquer alteração feita em um aparelho aparece nos outros.
   Sem migração automática — o Firestore às vezes entrega um instantâneo vazio do cache local antes do
   dado real chegar, e migrar nesse momento sobrescreve vinhos reais com os padrões. */
onSnapshot(winesColl,snap=>{
  wines=snap.docs.map(d=>d.data());
  winesLoaded=true;checkReady();route();
},err=>{console.error('Erro ao carregar vinhos do banco:',err);dbError=err.code||err.message;route();});

onSnapshot(settingsRef,snap=>{
  if(snap.exists()){
    const d=snap.data();
    settings={
      categories:Array.isArray(d.categories)&&d.categories.length?d.categories:structuredClone(DEFAULT_SETTINGS.categories),
      priceRanges:Array.isArray(d.priceRanges)&&d.priceRanges.length?d.priceRanges:structuredClone(DEFAULT_SETTINGS.priceRanges),
    };
  }else{settings=structuredClone(DEFAULT_SETTINGS);setDoc(settingsRef,settings).catch(e=>console.error('Erro ao criar configurações iniciais:',e));}
  settingsLoaded=true;checkReady();route();
},err=>{console.error('Erro ao carregar configurações do banco:',err);dbError=err.code||err.message;route();});

function checkReady(){if(winesLoaded&&settingsLoaded)dbReady=true;}

/* ---------------- routing ---------------- */
function route(){
  if(!location.hash){
    /* Sem endereço definido ainda: computador entra direto nas configurações, celular/tablet no cardápio. */
    history.replaceState(null,'',IS_DESKTOP?'#admin':'#catalogo');
  }
  const isAdmin=location.hash.startsWith('#admin');
  document.getElementById('customer').classList.toggle('hide',isAdmin);
  document.getElementById('admin').classList.toggle('hide',!isAdmin);
  if(dbError){
    document.getElementById(isAdmin?'admin':'customer').innerHTML=`<div style="padding:5rem 1.5rem;text-align:center;color:var(--text-muted);max-width:520px;margin:0 auto">
      <p style="color:var(--ink);font-weight:600;margin-bottom:.6rem">Não foi possível conectar ao banco de dados.</p>
      <p style="font-size:.85rem;margin-bottom:.6rem">Erro: ${dbError}</p>
      <p style="font-size:.85rem">Verifique se as Regras do Firestore foram salvas e publicadas no console do Firebase.</p>
    </div>`;
    return;
  }
  if(!dbReady){
    document.getElementById(isAdmin?'admin':'customer').innerHTML='<div style="padding:5rem 1.5rem;text-align:center;color:var(--text-muted)">Carregando…</div>';
    return;
  }
  if(isAdmin){renderAdmin();}else{renderCustomer();}
}
window.addEventListener('hashchange',route);

/* ================= CUSTOMER ================= */
let custState={q:'',category:'',country:'',grape:'',min:'',max:'',filtersOpen:false};

function availableWines(){return wines.filter(w=>w.active&&w.stock>0);}
function uniq(arr){return [...new Set(arr)].filter(Boolean).sort();}

function filteredWines(){
  const s=custState;
  return availableWines().filter(w=>{
    if(s.q){
      const hay=(w.name+' '+w.grape+' '+w.country+' '+w.region+' '+w.category).toLowerCase();
      if(!hay.includes(s.q.toLowerCase()))return false;
    }
    if(s.category&&w.category!==s.category)return false;
    if(s.country&&w.country!==s.country)return false;
    if(s.grape&&w.grape!==s.grape)return false;
    if(s.min&&w.price<Number(s.min))return false;
    if(s.max&&w.price>Number(s.max))return false;
    return true;
  });
}

  const avail=availableWines();
  const countries=uniq(avail.map(w=>w.country));
  const grapes=uniq(avail.map(w=>w.grape));

  const s=custState;

  el.innerHTML=`
    <div class="cust-header">
      <div class="brand-row">
        <h1>Adega <span>Digital</span></h1>
        <span class="count-tag">${avail.length} vinhos</span>
      </div>
      <div class="search-row">
        <input id="searchInput" placeholder="Buscar por nome, uva, país..." value="${escAttr(s.q)}">
        <button class="filter-toggle ${s.filtersOpen?'active':''}" id="toggleFilters">Filtros</button>
      </div>
      <div class="tab-row country-tabs">
        <button class="tab-btn ${!s.country?'active':''}" data-country="">Todos os países</button>
        ${countries.map(c=>`<button class="tab-btn ${s.country===c?'active':''}" data-country="${c}">${c}</button>`).join('')}
      </div>
    </div>
    <div class="filters ${s.filtersOpen?'':'hide'}">
      <div class="full"><label>Categoria</label>
        <div class="pill-group">
          <button class="tab-btn ${!s.category?'active':''}" data-cat="">Todas</button>
          ${settings.categories.map(c=>`<button class="tab-btn ${s.category===c?'active':''}" data-cat="${c}">${c}</button>`).join('')}
        </div>
      </div>
      <div class="full"><label>Uva</label>
        <div class="pill-group">
          <button class="tab-btn ${!s.grape?'active':''}" data-grape="">Todas</button>
          ${grapes.map(c=>`<button class="tab-btn ${s.grape===c?'active':''}" data-grape="${c}">${c}</button>`).join('')}
        </div>
      </div>
      <div class="full"><label>Faixa de preço</label>
        <div class="pill-group">
          <button class="tab-btn ${(!s.min&&!s.max)?'active':''}" data-price="">Todos os preços</button>
          ${settings.priceRanges.map((r,i)=>`<button class="tab-btn ${(s.min===r.min&&s.max===r.max)?'active':''}" data-price="${i}">${r.label}</button>`).join('')}
        </div>
      </div>
      <button class="clear-filters" id="clearFilters">Limpar filtros</button>
    </div>
    <div class="catalog">
      ${list.length?list.map(cardHtml).join(''):''}
    </div>
    ${list.length?'':`<div class="empty-state"><h3>Nenhum vinho encontrado</h3><p>Tente ajustar a busca ou os filtros.</p></div>`}
    <div class="cust-footer">
      <a href="#admin">Área administrativa</a>
    </div>
  `;

  document.getElementById('searchInput').oninput=e=>{custState.q=e.target.value;renderCustomerListOnly();};
  document.getElementById('toggleFilters').onclick=()=>{custState.filtersOpen=!custState.filtersOpen;renderCustomer();};
  document.getElementById('clearFilters').onclick=()=>{custState={...custState,category:'',grape:'',min:'',max:''};renderCustomer();};
  el.querySelectorAll('[data-country]').forEach(b=>b.onclick=()=>{custState.country=b.dataset.country;renderCustomer();});
  el.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{custState.category=b.dataset.cat;renderCustomer();});
  el.querySelectorAll('[data-grape]').forEach(b=>b.onclick=()=>{custState.grape=b.dataset.grape;renderCustomer();});
  el.querySelectorAll('[data-price]').forEach(b=>b.onclick=()=>{
    const idx=b.dataset.price;
    if(idx===''){custState.min='';custState.max='';}
    else{const r=settings.priceRanges[Number(idx)];custState.min=r.min;custState.max=r.max;}
    renderCustomer();
  });
  bindWineCards(el);
}

function renderCustomerListOnly(){
  const list=filteredWines();
  const catalog=document.querySelector('.catalog');
  const empty=document.querySelector('.empty-state');
  if(catalog)catalog.innerHTML=list.map(cardHtml).join('');
  if(empty)empty.remove();
  if(!list.length&&catalog){
    catalog.insertAdjacentHTML('afterend','<div class="empty-state"><h3>Nenhum vinho encontrado</h3><p>Tente ajustar a busca ou os filtros.</p></div>');
  }
  bindWineCards(document);
}

function bindWineCards(scope){
  scope.querySelectorAll('.wine-card').forEach(c=>{
    c.onclick=()=>openWineModal(Number(c.dataset.id));
    c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openWineModal(Number(c.dataset.id));}};
  });
}

function cardHtml(w){
  return `<div class="wine-card" role="button" tabindex="0" data-id="${w.id}">
    <div class="thumb"><img src="${escAttr(w.thumb||w.image)}" alt="${escAttr(w.name)}" loading="lazy"></div>
    <div class="info">
      <span class="cat-pill">${w.category}</span>
      <h3>${w.name}</h3>
      <div class="origin">${w.country} · ${w.grape}</div>
      <div class="price">${fmtPrice(w.price)}</div>
    </div>
  </div>`;
}

function sealColor(code){
  return {Vermelho:'#B3352E',Azul:'#2E5FB3',Dourado:'#C9A227',Preto:'#1A1A1A',Amarelo:'#E8C547',Prata:'#B8BEC4'}[code]||'#999';
}

function openWineModal(id){
  const w=wines.find(x=>x.id===id); if(!w)return;
  const seal=w.colorCode?`<div class="seal-tag"><span class="seal-dot" style="background:${sealColor(w.colorCode)}"></span> Selo ${w.colorCode} — mostre ao garçom</div>`:'';
  const back=document.createElement('div');
  back.className='modal-back';
  back.innerHTML=`<div class="modal">
    <button class="close-btn" id="closeModal">✕</button>
    <div class="hero"><img src="${escAttr(w.image)}" alt="${escAttr(w.name)}"></div>
    <div class="modal-body">
      <span class="cat-pill">${w.category}</span>
      <h2>${w.name}</h2>
      <div class="origin">${w.country} — ${w.region}</div>
      <div class="modal-price">${fmtPrice(w.price)}</div>
      <dl class="spec-grid">
        <div><dt>Uva</dt><dd>${w.grape}</dd></div>
        <div><dt>Categoria</dt><dd>${w.category}</dd></div>
        ${w.abv?`<div><dt>Teor alcoólico</dt><dd>${w.abv}%</dd></div>`:''}
        ${w.sweetness?`<div><dt>Tipo</dt><dd>${w.sweetness}</dd></div>`:''}
      </dl>
      <p class="modal-desc">${w.description||''}</p>
      <div class="avail"><span class="dot"></span> Disponível na adega</div>

    </div>
  </div>`;
  document.body.appendChild(back);
  back.onclick=e=>{if(e.target===back||e.target.id==='closeModal'){back.remove();}};
}

function escAttr(s){return String(s??'').replace(/"/g,'&quot;');}

function tryLogin(){
  const val=document.getElementById('passInput').value;
  if(val===ADMIN_PASS){sessionStorage.setItem('adega_admin','1');adminAuthed=true;renderAdmin();}
  else{document.getElementById('loginErr').textContent='Senha incorreta.';}
}

function adminRowHtml(w){
  return `<tr>
    <td><div class="row-name"><img class="row-thumb" src="${escAttr(w.thumb||w.image)}" alt=""><span>${w.name}</span></div></td>
    <td>${fmtPrice(w.price)}</td>
    <td>${w.country}</td>
    <td><div class="stock-ctrl"><button data-dec="${w.id}">−</button><span>${w.stock}</span><button data-inc="${w.id}">+</button></div></td>
    <td><button class="badge ${w.active&&w.stock>0?'on':'off'}" data-toggle="${w.id}">${w.active?(w.stock>0?'Disponível':'Sem estoque'):'Desativado'}</button></td>
    <td>${w.colorCode||'—'}</td>
    <td><div class="row-actions"><button data-edit="${w.id}">editar</button><button data-del="${w.id}">excluir</button></div></td>
  </tr>`;
}

function changeStock(id,delta){
  const w=wines.find(x=>x.id===id); if(!w)return;
  w.stock=Math.max(0,w.stock+delta);
  saveWine(w); renderAdmin();
}
function toggleActive(id){
  const w=wines.find(x=>x.id===id); if(!w)return;
  w.active=!w.active; saveWine(w); renderAdmin();
}
function deleteWine(id){
  if(!confirm('Excluir este vinho permanentemente?'))return;
  const backup=wines.find(w=>w.id===id);
  wines=wines.filter(w=>w.id!==id); renderAdmin();
  deleteWineDoc(id).catch(e=>{
    console.error('Erro ao excluir vinho no banco:',e);
    if(backup&&!wines.some(w=>w.id===id)){wines.push(backup);}
    renderAdmin();
    alert('Não foi possível excluir: '+(e.code||e.message||'erro desconhecido')+'. Provavelmente as Regras do Firestore estão bloqueando exclusão — veja a aba "Regras" no console do Firebase.');
  });
}

      [pendingImage,pendingThumb]=await Promise.all([resizeImage(file,1400,0.85),resizeImage(file,480,0.7)]);
      preview.src=pendingThumb;
      preview.style.display='';
    }catch(err){
      console.error('Erro ao processar foto:',err);
      alert('Não foi possível usar essa foto. Tente outra imagem.');
    }
  };
  document.getElementById('saveForm').onclick=()=>{
    const saveBtn=document.getElementById('saveForm');
    const imageUrl=pendingImage||w.image||'';
    const thumbUrl=pendingThumb||w.thumb||w.image||'';
    const data={
      name:document.getElementById('fName').value.trim(),
      image:imageUrl,
      thumb:thumbUrl,
      price:Number(document.getElementById('fPrice').value)||0,
      stock:Math.max(0,Number(document.getElementById('fStock').value)||0),
      country:document.getElementById('fCountry').value.trim(),
      region:document.getElementById('fRegion').value.trim(),
      grape:document.getElementById('fGrape').value.trim(),
      category:document.getElementById('fCategory').value,
      abv:document.getElementById('fAbv').value===''?null:Number(document.getElementById('fAbv').value),
      sweetness:document.getElementById('fSweetness').value,
      description:document.getElementById('fDesc').value.trim(),
      colorCode:document.getElementById('fColor').value,
      active:document.getElementById('fActive').checked,
    };
    if(!data.name){alert('Informe o nome do vinho.');saveBtn.disabled=false;saveBtn.textContent='Salvar';return;}
    let saved;
    if(editing){Object.assign(w,data);saved=w;}
    else{saved={id:nextId(),...data};wines.push(saved);}
    saveWine(saved); back.remove(); renderAdmin();
  };
}

function openBulkImportModal(){
  const back=document.createElement('div');
  back.className='modal-back';
  back.innerHTML=`<div class="form-modal">
    <h2 class="serif">Importar vinhos em lote</h2>
    <p class="hint">Cole abaixo uma lista de vinhos em formato JSON (um array de objetos) e clique em Importar. Cada vinho vira um item novo no catálogo — depois é só adicionar a foto de cada um.</p>
    <textarea id="bulkImportText" rows="12" style="width:100%;font-family:monospace;font-size:.8rem" placeholder='[{"name":"Nome do vinho","country":"Chile","region":"...","grape":"...","category":"Tinto","price":89,"stock":6,"abv":13.5,"sweetness":"Seco","description":"...","active":true}]'></textarea>
    <div class="err" id="bulkImportErr"></div>
    <div class="form-actions">
      <button class="btn-outline" id="cancelBulkImport">Cancelar</button>
      <button class="btn" id="confirmBulkImport">Importar</button>
    </div>
  </div>`;
  document.body.appendChild(back);
  back.onclick=e=>{if(e.target===back)back.remove();};
  document.getElementById('cancelBulkImport').onclick=()=>back.remove();
  document.getElementById('confirmBulkImport').onclick=()=>{
    const errEl=document.getElementById('bulkImportErr');
    errEl.textContent='';
    let list;
    try{
      list=JSON.parse(document.getElementById('bulkImportText').value);
      if(!Array.isArray(list)||!list.length)throw new Error('O texto colado precisa ser uma lista (array) de vinhos.');
    }catch(e){errEl.textContent='JSON inválido: '+e.message;return;}
    let id=nextId();
    const toSave=list.map(w=>{
      const saved={
        id:id++,
        name:String(w.name||'').trim(),
        image:w.image||'',
        thumb:w.thumb||w.image||'',
        price:Number(w.price)||0,
        stock:Math.max(0,Number(w.stock)||0),
        country:String(w.country||'').trim(),
        region:String(w.region||'').trim(),
        grape:String(w.grape||'').trim(),
        category:String(w.category||settings.categories[0]||'').trim(),
        abv:w.abv==null||w.abv===''?null:Number(w.abv),
        sweetness:w.sweetness||'',
        description:String(w.description||'').trim(),
        colorCode:w.colorCode||'',
        active:w.active!==false,
      };
      wines.push(saved);
      return saved;
    });
    toSave.forEach(saveWine);
    back.remove();
    renderAdmin();
    alert(toSave.length+' vinho(s) importado(s) com sucesso.');
  };
}

function downloadBackup(){
  const blob=new Blob([JSON.stringify(wines,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const stamp=new Date().toISOString().slice(0,10);
  a.href=url; a.download='backup-vinhos-'+stamp+'.json'; a.click();
  URL.revokeObjectURL(url);
}

function openShareModal(){
  const link=location.origin+location.pathname+'#catalogo';
  const qrUrl='https://api.qrserver.com/v1/create-qr-code/?size=400x400&data='+encodeURIComponent(link);
  const back=document.createElement('div');
  back.className='modal-back';
  back.innerHTML=`<div class="form-modal share-modal">
    <h2 class="serif">Divulgar cardápio</h2>
    <p class="hint">Envie este link aos clientes ou baixe o QR Code para colocar nas mesas.</p>
    <div class="share-link-row">
      <input id="shareLinkInput" readonly value="${escAttr(link)}">
      <button class="btn-outline" id="copyLinkBtn">Copiar</button>
    </div>
    <div class="share-qr"><img src="${qrUrl}" alt="QR Code do cardápio" width="220" height="220"></div>
    <div class="form-actions">
      <button class="btn-outline" id="closeShare">Fechar</button>
      <button class="btn" id="downloadQrBtn">Baixar QR Code</button>
    </div>
  </div>`;
  document.body.appendChild(back);
  back.onclick=e=>{if(e.target===back)back.remove();};
  document.getElementById('closeShare').onclick=()=>back.remove();
  document.getElementById('copyLinkBtn').onclick=()=>{
    const input=document.getElementById('shareLinkInput');
    const btn=document.getElementById('copyLinkBtn');
    const done=()=>{btn.textContent='Copiado!';setTimeout(()=>btn.textContent='Copiar',1500);};
    if(navigator.clipboard&&window.isSecureContext){
      navigator.clipboard.writeText(link).then(done).catch(()=>{input.select();document.execCommand('copy');done();});
    }else{input.select();document.execCommand('copy');done();}
  };
  document.getElementById('downloadQrBtn').onclick=()=>{
    fetch(qrUrl).then(r=>r.blob()).then(blob=>{
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download='qrcode-cardapio.png'; a.click();
      URL.revokeObjectURL(url);
    }).catch(()=>window.open(qrUrl,'_blank'));
  };
}

route();
</script>
