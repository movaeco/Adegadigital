<style>
:root{
  --ink:#0B0B0B; --ink-soft:#3A3A3A; --ink-faint:#8A8A86;
  --paper:#FFFFFF; --panel:#FAFAF8; --line:#E4E3DF; --line-strong:#0B0B0B;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F3F3F0; --border:#E4E3DF;
  --text:#0B0B0B; --text-muted:#7A7A76; --ok:#0B0B0B;
  --radius:3px; --radius-lg:5px;
  --shadow-card:0 1px 2px rgba(11,11,11,.04);
  --shadow-lift:0 18px 30px -18px rgba(11,11,11,.35);
  --shadow-modal:0 30px 60px -20px rgba(11,11,11,.45);
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:var(--bg); color:var(--text);
  font-family:'Montserrat',system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;transition:opacity .15s ease,background-color .15s ease,border-color .15s ease,transform .15s ease}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input,select,textarea{font-family:inherit;background:var(--paper);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:.65rem .75rem;font-size:.92rem;transition:border-color .15s ease}
input::placeholder,textarea::placeholder{color:var(--ink-faint)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
a{color:inherit}
img{display:block;max-width:100%}
.hide{display:none!important}

/* ---------- Customer shell ---------- */
#customer{max-width:1120px;margin:0 auto;padding:0 0 6rem}
.cust-header{
  position:sticky;top:0;z-index:10;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);
  padding:1.35rem 1.5rem 1.1rem;border-bottom:1px solid var(--line);
}
.brand-row{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;margin-bottom:1.05rem}
.brand-row h1{font-size:1.65rem;font-weight:500;letter-spacing:-.01em}
.brand-row span{font-style:italic;font-weight:400}
.count-tag{font-size:.76rem;color:var(--text-muted);white-space:nowrap;padding-top:.15rem}
.search-row{display:flex;gap:.6rem}
.search-row input{flex:1;background:var(--panel)}
.filter-toggle{border:1px solid var(--border);padding:.65rem 1rem;border-radius:var(--radius);font-size:.84rem;white-space:nowrap;background:var(--paper)}
.filter-toggle:hover{border-color:var(--ink)}
.filter-toggle.active{border-color:var(--ink);background:var(--ink);color:var(--paper)}

.filters{padding:1rem 1.5rem;border-bottom:1px solid var(--line);display:grid;gap:.85rem;grid-template-columns:1fr 1fr;background:var(--panel)}
.filters label{display:block;font-size:.72rem;color:var(--text-muted);margin-bottom:.35rem;letter-spacing:.01em}
.filters select,.filters input{background:var(--paper)}
.price-inputs{display:flex;gap:.5rem;align-items:center}
.price-inputs span{color:var(--ink-faint)}
.price-inputs input{width:100%}
.filters .full{grid-column:1/-1}
.pill-group{display:flex;flex-wrap:wrap;gap:.5rem}
.clear-filters{grid-column:1/-1;text-align:right;font-size:.8rem;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.clear-filters:hover{color:var(--ink)}

.tab-row{display:flex;gap:.5rem;overflow-x:auto;padding:.2rem .02rem;scrollbar-width:none;-ms-overflow-style:none}
.tab-row::-webkit-scrollbar{display:none}
.country-tabs{margin-top:1rem}
.tab-btn{flex:0 0 auto;padding:.55rem 1.05rem;border-radius:99px;font-size:.85rem;font-weight:500;border:1px solid var(--border);background:var(--paper);white-space:nowrap;transition:background-color .15s ease,color .15s ease,border-color .15s ease}
.tab-btn:hover{border-color:var(--ink)}
.tab-btn.active{background:var(--ink);color:#FFFFFF;border-color:var(--ink)}
.country-tabs .tab-btn{font-size:.78rem;padding:.42rem .9rem;color:var(--text-muted);border-color:var(--line)}
.country-tabs .tab-btn.active{background:var(--ink);color:#FFFFFF;border-color:var(--ink)}

.catalog{padding:1.25rem;display:grid;gap:1rem;grid-template-columns:repeat(2,1fr)}
@media(min-width:520px){.catalog{padding:1.5rem;gap:1.5rem}}
@media(min-width:900px){.catalog{grid-template-columns:repeat(3,1fr);gap:1.75rem;padding:1.75rem}}
.wine-card.reveal{opacity:0;transform:translateY(32px)}
.wine-card.reveal.in{opacity:1;transform:translateY(0);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.3,1),box-shadow .22s ease,border-color .22s ease}
.wine-card.reveal.in:hover{transform:translateY(-3px)}
@media(prefers-reduced-motion:reduce){.wine-card.reveal{opacity:1;transform:none}}
.wine-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;text-align:left;box-shadow:var(--shadow-card);transition:transform .22s cubic-bezier(.2,.7,.3,1),box-shadow .22s ease,border-color .22s ease}
.wine-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);border-color:#CFCFC9}
.wine-card .thumb{aspect-ratio:3/4;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid var(--line)}
.wine-card .thumb img{width:100%;height:100%;object-fit:contain;padding:6%;transition:transform .4s ease}
.wine-card:hover .thumb img{transform:scale(1.045)}
.wine-card .info{padding:.85rem .9rem 1rem}
.cat-pill{display:inline-block;font-size:.64rem;letter-spacing:.02em;color:var(--ink-soft);border:1px solid var(--line);border-radius:99px;padding:.15rem .55rem;margin-bottom:.55rem}
.wine-card h3{font-size:1.02rem;font-weight:500;line-height:1.28;margin-bottom:.2rem}
.wine-card .origin{font-size:.79rem;color:var(--text-muted);margin-bottom:.6rem}
.wine-card .price{font-size:.96rem;font-weight:600;font-variant-numeric:tabular-nums}
.empty-state{padding:4rem 1.25rem;text-align:center;color:var(--text-muted)}
.empty-state h3{color:var(--text);font-weight:500;margin-bottom:.4rem}
.cust-footer{padding:2.2rem 1.5rem 1rem;text-align:center;border-top:1px solid var(--line);margin-top:1rem}
.cust-footer a{font-size:.78rem;color:var(--text-muted);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.cust-footer a:hover{color:var(--ink)}

/* bottom nav (cliente) */
.cust-nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:.35rem .5rem calc(.35rem + env(safe-area-inset-bottom,0px))}
.cust-nav .nav-item{flex:1;max-width:200px;display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.45rem .3rem;color:var(--ink-faint);font-size:.7rem;font-weight:500;letter-spacing:.02em;border-radius:var(--radius)}
.cust-nav .nav-item svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cust-nav .nav-item:hover{color:var(--ink)}
.cust-nav .nav-item.active{color:var(--ink)}
.cust-nav .nav-item.active span{border-bottom:2px solid var(--ink);padding-bottom:1px}
.rank-page{max-width:640px;margin:0 auto;padding:1.6rem 1.25rem .4rem}
.rank-page .rank-sub{font-size:.85rem;color:var(--text-muted);margin:.25rem 0 1rem}
.rank-item .rank-thumb{width:46px;height:58px;border-radius:var(--radius);object-fit:contain;background:#fff;flex-shrink:0}
.rank-item .rank-info{flex:1;min-width:0}
.rank-item .rank-info .rank-name{display:block}
.rank-item .rank-meta{display:block;font-size:.76rem;color:var(--text-muted);margin-top:.1rem}
.rank-item.top .rank-meta{color:rgba(255,255,255,.7)}
.rank-item .rank-price{font-size:.92rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.rl-inline{max-width:520px;margin:0 auto;padding:1.6rem 1.4rem 1.5rem}
.rl-inline .close-btn{display:none}

/* harmonização (botão + pratos da casa) */
.pair-btn{display:flex;align-items:center;justify-content:space-between;gap:.6rem;width:100%;padding:.8rem 1rem;margin:0 0 1.1rem;border:1px solid var(--ink);border-radius:var(--radius);font-size:.9rem;font-weight:500;text-align:left}
.pair-btn:hover{background:var(--ink);color:#fff}
.pair-btn .chev{transition:transform .2s ease}
.pair-btn[aria-expanded=true]{background:var(--ink);color:#fff;border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0}
.pair-btn[aria-expanded=true] .chev{transform:rotate(180deg)}
.pair-text{margin:0 0 1.1rem;padding:1rem;background:var(--panel);border:1px solid var(--ink);border-top:none;border-radius:0 0 var(--radius) var(--radius);font-size:.88rem;line-height:1.5}
.pair-text h4{font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);font-weight:600;margin:0 0 .5rem}
.pair-text h4:not(:first-child){margin-top:1rem}
.pair-text .dish{padding:.5rem 0;border-top:1px solid var(--line)}
.pair-text h4+.dish{border-top:none;padding-top:0}
.pair-text .dish b{display:block;font-weight:600}
.pair-text .dish span{display:block;color:var(--text-muted);font-size:.8rem;margin-top:.1rem}
.pair-pick{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.4rem}
.pair-pick label{display:inline-flex;align-items:center;gap:.35rem;font-size:.8rem;padding:.3rem .7rem;border:1px solid var(--border);border-radius:99px;cursor:pointer;margin:0;color:var(--ink)}
.pair-pick input{width:auto}
.pair-pick label:has(input:checked){background:var(--ink);color:#fff;border-color:var(--ink)}

/* modal */
.modal-back{position:fixed;inset:0;background:rgba(11,11,11,.78);z-index:50;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
@media(min-width:640px){.modal-back{align-items:center}}
.modal{background:var(--paper);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:var(--radius-lg);box-shadow:var(--shadow-modal)}
.modal .hero{aspect-ratio:1/1;max-height:46vh;width:100%;background:#fff;border-bottom:1px solid var(--line)}
.modal .hero img{width:100%;height:100%;object-fit:contain;padding:4%}
.modal-body{padding:1.6rem 1.6rem 2rem}
.modal-body h2{font-size:1.6rem;font-weight:500;margin-bottom:.25rem}
.modal-body .origin{color:var(--text-muted);margin-bottom:1rem;font-size:.92rem}
.modal-price{font-size:1.35rem;font-weight:600;margin-bottom:1.1rem;font-variant-numeric:tabular-nums}
.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem 1rem;margin-bottom:1.1rem;font-size:.86rem;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:.9rem 0}
.spec-grid dt{color:var(--text-muted);font-size:.72rem;letter-spacing:.02em}
.spec-grid dd{margin-top:.15rem;font-weight:500}
.modal-desc{font-size:.92rem;line-height:1.65;color:var(--ink-soft);margin-bottom:1.3rem}
.avail{display:inline-flex;align-items:center;gap:.5rem;font-size:.82rem}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.seal-tag{display:inline-flex;align-items:center;gap:.55rem;font-size:.78rem;color:var(--text-muted);margin-top:.7rem;padding-top:.7rem;border-top:1px dashed var(--line)}
.seal-dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.25);flex-shrink:0}
.close-btn{position:sticky;top:.9rem;margin-left:auto;margin-right:.9rem;display:flex;align-items:center;justify-content:center;background:rgba(11,11,11,.55);color:#FFFFFF;width:34px;height:34px;border-radius:50%;font-size:1rem;z-index:2}
.close-btn:hover{background:var(--ink)}

/* ---------- Admin shell ---------- */
#admin{max-width:1180px;margin:0 auto;padding:1.75rem 1.5rem 4rem}
.login-box{max-width:340px;margin:15vh auto;background:var(--paper);border:1px solid var(--line);padding:2.25rem;border-radius:var(--radius-lg);box-shadow:var(--shadow-card)}
.login-box h2{margin-bottom:.35rem}
.login-box p{color:var(--text-muted);font-size:.85rem;margin-bottom:1.4rem;line-height:1.5}
.login-box input{width:100%;margin-bottom:.9rem;background:var(--panel)}
.btn{background:var(--ink);color:#FFFFFF;padding:.7rem 1.2rem;border-radius:var(--radius);font-weight:600;font-size:.9rem;border:1px solid var(--ink)}
.btn:hover{background:#000000;transform:translateY(-1px)}
.btn-outline{border:1px solid var(--border);padding:.7rem 1.2rem;border-radius:var(--radius);font-size:.9rem;background:var(--paper)}
.btn-outline:hover{border-color:var(--ink)}
.btn-ghost{color:var(--text-muted);font-size:.85rem;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.btn-ghost:hover{color:var(--ink)}
.err{color:var(--text);font-weight:600;font-size:.82rem;min-height:1.2em}

.admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.6rem;flex-wrap:wrap;gap:.6rem;padding-bottom:1.1rem;border-bottom:1px solid var(--line)}
.stat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:.9rem;margin-bottom:1.8rem}
@media(min-width:720px){.stat-row{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--paper);border:1px solid var(--line);padding:1.1rem 1.2rem;border-radius:var(--radius-lg);box-shadow:var(--shadow-card)}
.stat .n{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:500}
.stat .l{font-size:.78rem;color:var(--text-muted);margin-top:.1rem}
.admin-toolbar{display:flex;justify-content:space-between;gap:.7rem;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.admin-toolbar input{min-width:220px;background:var(--panel)}
table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
th,td{padding:.8rem .9rem;text-align:left;font-size:.85rem;border-bottom:1px solid var(--line)}
th{color:var(--text-muted);font-weight:500;font-size:.72rem;letter-spacing:.02em;background:var(--panel)}
tr:last-child td{border-bottom:none}
tbody tr{transition:background-color .15s ease}
tbody tr:hover{background:var(--panel)}
.row-name{display:flex;align-items:center;gap:.7rem}
.row-thumb{width:36px;height:48px;object-fit:contain;background:#fff;border-radius:var(--radius);border:1px solid var(--line)}
.stock-ctrl{display:inline-flex;align-items:center;gap:.5rem}
.stock-ctrl button{width:24px;height:24px;border:1px solid var(--border);border-radius:var(--radius);background:var(--paper)}
.stock-ctrl button:hover{border-color:var(--ink);background:var(--ink);color:#FFFFFF}
.badge{font-size:.7rem;padding:.2rem .55rem;border-radius:99px}
.badge.on{color:#FFFFFF;background:var(--ink);border:1px solid var(--ink)}
.badge.off{color:var(--text-muted);border:1px solid var(--border)}
.row-actions{display:flex;gap:.6rem;font-size:.78rem}
.row-actions button{text-decoration:underline;text-underline-offset:3px;color:var(--text-muted);text-decoration-color:var(--line)}
.row-actions button:hover{color:var(--ink)}
.tbl-wrap{overflow-x:auto;border-radius:var(--radius-lg)}

/* form modal */
.form-modal{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:var(--radius-lg);padding:1.75rem;box-shadow:var(--shadow-modal)}
.form-modal h2{margin-bottom:1.1rem}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:.85rem}
.f-grid .full{grid-column:1/-1}
.f-grid label{display:block;font-size:.75rem;color:var(--text-muted);margin-bottom:.35rem}
.f-grid input,.f-grid select,.f-grid textarea{width:100%;background:var(--panel)}
.photo-pick{display:flex;align-items:center;gap:.9rem}
.photo-pick img{width:60px;height:80px;object-fit:contain;background:#fff;border-radius:var(--radius);border:1px solid var(--line);flex-shrink:0}
.photo-pick input[type=file]{flex:1;font-size:.8rem}
.toggle-row{display:flex;align-items:center;gap:.6rem;margin-top:.4rem}
.form-actions{display:flex;justify-content:flex-end;gap:.7rem;margin-top:1.5rem;padding-top:1.2rem;border-top:1px solid var(--line)}

/* settings */
.admin-nav{display:flex;gap:.4rem;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:.25rem}
.admin-nav button{padding:.5rem 1.05rem;border-radius:99px;font-size:.84rem;font-weight:500;color:var(--text-muted)}
.admin-nav button.active{background:var(--ink);color:#FFFFFF}
.settings-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);padding:1.4rem;margin-bottom:1.2rem;box-shadow:var(--shadow-card)}
.settings-card h2{font-size:1.15rem;margin-bottom:.2rem}
.settings-card .hint{color:var(--text-muted);font-size:.82rem;margin-bottom:1.1rem}
.settings-row{display:flex;gap:.6rem;align-items:center;margin-bottom:.6rem}
.settings-row input{flex:1;background:var(--panel)}
.settings-row .price-label{flex:2}
.settings-row .price-num{flex:1}
.settings-row .icon-del{width:34px;height:34px;flex:0 0 auto;border:1px solid var(--border);border-radius:var(--radius);color:var(--text-muted);font-size:.95rem}
.settings-row .icon-del:hover{border-color:var(--ink);color:var(--ink);background:var(--panel)}
.settings-add{display:flex;gap:.6rem;margin-top:.9rem;padding-top:.9rem;border-top:1px dashed var(--line)}
.settings-add input{flex:1;background:var(--panel)}

/* share modal */
.share-modal{max-width:420px;text-align:center}
.share-modal .hint{color:var(--text-muted);font-size:.82rem;margin-top:.3rem}
.share-link-row{display:flex;gap:.6rem;margin:1.1rem 0}
.share-link-row input{flex:1;background:var(--panel);font-size:.82rem}
.share-qr{display:flex;justify-content:center;margin-bottom:.3rem}
.share-qr img{border:1px solid var(--line);border-radius:var(--radius)}

/* ---------- Ranking ---------- */
.rank-wrap{padding:1.6rem 1.5rem .4rem}
.rank-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:.9rem}
.rank-title h2{font-size:1.25rem}
.rank-title span{font-size:.74rem;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase}
.rank-list{list-style:none;border-top:1px solid var(--line-strong)}
.rank-item{display:flex;align-items:center;gap:1.1rem;width:100%;text-align:left;padding:.95rem .2rem;border-bottom:1px solid var(--line)}
.rank-item:hover .rank-name{text-decoration:underline;text-underline-offset:4px}
.rank-pos{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:2rem;line-height:1;width:2.2rem;color:var(--ink-faint);flex-shrink:0}
.rank-name{font-family:'Cormorant Garamond',serif;font-size:1.05rem;flex:1}
.rank-item.top{background:var(--ink);color:#fff;padding:1.15rem 1rem;border-radius:var(--radius-lg);margin:.7rem 0;border:none}
.rank-item.top .rank-pos{color:#fff;font-size:2.6rem}
.rank-item.top .rank-name{font-size:1.25rem}
.rank-tag{font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid rgba(255,255,255,.5);padding:.2rem .5rem;border-radius:99px;white-space:nowrap}
.rank-bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:90px}
.rank-bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.sale-btn{border:1px solid var(--ink);padding:.2rem .55rem;border-radius:var(--radius);font-size:.74rem;margin-left:.4rem}
.sale-btn:hover{background:var(--ink);color:#fff}
.sale-btn.undo{border-color:var(--border);color:var(--text-muted)}

/* ---------- Roleta ---------- */
.rl-banner{margin:1.4rem 1.5rem 0;border:1px solid var(--line-strong);border-radius:var(--radius-lg);padding:1.15rem 1.2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;background:var(--panel)}
.rl-banner h3{font-size:1.1rem}
.rl-banner p{font-size:.8rem;color:var(--text-muted);margin-top:.15rem}
.rl-modal{padding:1.6rem 1.4rem 1.5rem;position:relative}
.rl-modal h2{font-size:1.4rem;margin-bottom:.3rem}
.rl-sub{font-size:.85rem;color:var(--text-muted);margin-bottom:1.2rem}
.rl-opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--radius-lg);padding:1rem 1.1rem;margin-bottom:.8rem;background:var(--paper)}
.rl-opt:hover{border-color:var(--ink)}
.rl-opt b{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:1.05rem;display:block}
.rl-opt span{font-size:.8rem;color:var(--text-muted)}
.rl-list{max-height:42vh;overflow-y:auto;border-top:1px solid var(--line);margin-top:.8rem}
.rl-row{display:flex;align-items:center;gap:.7rem;padding:.65rem .2rem;border-bottom:1px solid var(--line);cursor:pointer;font-size:.9rem}
.rl-row input{width:18px;height:18px;padding:0;accent-color:#0B0B0B}
.rl-foot{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-top:1rem}
.rl-count{font-size:.8rem;color:var(--text-muted)}
.rl-stage{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:.6rem auto 1.1rem}
.rl-stage canvas{width:100%;height:100%;border-radius:50%;box-shadow:var(--shadow-lift);transition:transform 5s cubic-bezier(.12,.6,.1,1)}
.rl-pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid var(--ink);z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.rl-hub{position:absolute;top:50%;left:50%;width:46px;height:46px;transform:translate(-50%,-50%);border-radius:50%;background:var(--paper);border:3px solid var(--ink);z-index:1}
.rl-result{text-align:center;min-height:5.2rem}
.rl-result .lbl{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}
.rl-result .win{font-family:'Cormorant Garamond',serif;font-size:1.5rem;margin:.25rem 0 .9rem;animation:rlpop .5s ease}
@keyframes rlpop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.rl-actions{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
/* roleta: revelação, som e confete */
.rl-pointer.flick{animation:rlflick .12s ease-out}
@keyframes rlflick{0%{transform:translateX(-50%) rotate(0)}40%{transform:translateX(-50%) rotate(-16deg)}100%{transform:translateX(-50%) rotate(0)}}
.rl-stage.landed canvas{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--ink),var(--shadow-lift)}
.rl-result .lbl{animation:rlfade .5s ease both}
.rl-result .win{animation:rlpop .6s cubic-bezier(.2,.8,.3,1.2) .15s both}
.rl-meta{font-size:.85rem;color:var(--text-muted);margin:-.55rem 0 .5rem;animation:rlfade .5s ease .5s both}
.rl-note{font-size:.78rem;color:var(--ink-soft);margin:0 0 .9rem;animation:rlfade .5s ease .8s both}
.rl-actions.late{animation:rlfade .5s ease 1.1s both}
.rl-again{display:block;margin:.8rem auto 0;animation:rlfade .5s ease 1.6s both}
@keyframes rlfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rl-sound{font-size:.8rem}
.rl-confetti{position:fixed;inset:0;pointer-events:none;z-index:9999}
@media(prefers-reduced-motion:reduce){.rl-pointer.flick{animation:none}}

/* ---------- Acabamento visual: identidade bordô ---------- */
:root{
  --ink:#2F3D2B; --wine:#2F3D2B; --wine-soft:#EDF1E8; --wine-line:#D9E0D2;
  --bg:#FBFBF8; --panel:#F4F6F0; --line:#E3E7DC; --border:#DADFD1; --ink-faint:#8B9186;
  --shadow-card:0 1px 2px rgba(47,61,43,.05);
  --shadow-lift:0 22px 34px -20px rgba(47,61,43,.45);
  --shadow-modal:0 30px 60px -20px rgba(47,61,43,.5);
  --radius:6px; --radius-lg:12px;
}
body{background:var(--bg);line-height:1.45}
.cust-header{background:rgba(251,251,248,.92);padding:1.5rem 1.5rem 1.15rem}
.brand-row h1{font-size:2rem;font-weight:500;letter-spacing:-.02em}
.brand-row span{font-style:italic;color:var(--wine)}
.search-row input{background:var(--paper);border-radius:99px;padding:.7rem 1.1rem}
.filter-toggle{border-radius:99px}
.tab-btn{border-radius:99px}
.btn{background:var(--wine);border-color:var(--wine);border-radius:99px;box-shadow:0 6px 14px -8px rgba(47,61,43,.7)}
.btn:hover{background:#222D1F}
.btn-outline{border-radius:99px}
/* cartões do catálogo: garrafa em destaque sobre fundo suave */
.wine-card{border-color:var(--wine-line);background:var(--paper)}
.wine-card:hover{border-color:#C5CDBB}
.wine-card .thumb{background:#fff;border-bottom:1px solid var(--line)}
.wine-card .info{padding:1rem 1.05rem 1.15rem}
.wine-card h3{font-size:1.08rem;line-height:1.25}
.wine-card .origin{color:var(--text-muted)}
.wine-card .price{color:var(--wine);font-size:1.02rem}
.cat-pill{background:var(--wine-soft);border-color:transparent;color:var(--wine);font-weight:500}
/* convite da roleta: o único bloco cheio da página */
.rl-banner{background:linear-gradient(135deg,#2F3D2B 0%,#46593D 100%);border:none;color:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-lift)}
.rl-banner p{color:rgba(255,255,255,.72)}
.rl-banner .btn,.rl-banner .btn-outline{background:#fff;color:var(--wine);border-color:#fff;box-shadow:none}
.rl-banner .btn:hover,.rl-banner .btn-outline:hover{background:var(--wine-soft)}
/* roleta */
.rl-opt{border-radius:var(--radius-lg)}
.rl-opt:hover{border-color:var(--wine);background:var(--wine-soft)}
.rl-stage canvas{box-shadow:0 0 0 6px var(--wine-soft),var(--shadow-lift)}
.rl-stage.landed canvas{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--wine),var(--shadow-lift)}
.rl-hub{border-color:var(--wine);box-shadow:0 2px 8px rgba(47,61,43,.3)}
.rl-result .win{font-size:1.65rem;color:var(--wine)}
/* navegação inferior */
.cust-nav{background:rgba(251,251,248,.95)}
.cust-nav .nav-item.active,.cust-nav .nav-item:hover{color:var(--wine)}
.cust-nav .nav-item.active span{border-bottom-color:var(--wine)}

/* ---------- Boas-vindas e gatilhos ---------- */
.welcome{margin:1.25rem 1.25rem 0;padding:1.6rem 1.4rem 1.4rem;border-radius:var(--radius-lg);background:linear-gradient(135deg,#2F3D2B 0%,#46593D 100%);color:#fff;box-shadow:var(--shadow-lift)}
@media(min-width:900px){.welcome{margin:1.5rem 1.75rem 0;padding:2rem}}
.welcome h2{font-size:1.65rem;line-height:1.2;max-width:22ch}
.welcome p{margin:.55rem 0 1.1rem;color:rgba(255,255,255,.78);font-size:.92rem;max-width:38ch}
.welcome .btn{background:#fff;color:var(--wine);border-color:#fff;box-shadow:none}
.welcome .btn:hover{background:var(--wine-soft)}
.pick-today{display:flex;align-items:center;gap:.9rem;width:100%;margin-top:1.3rem;padding:.7rem;text-align:left;color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:var(--radius-lg);background:rgba(255,255,255,.08)}
.pick-today:hover{background:rgba(255,255,255,.14)}
.pick-today img{width:52px;height:68px;object-fit:contain;background:#fff;border-radius:var(--radius);flex-shrink:0}
.pick-today .pt-info{display:flex;flex-direction:column;gap:.15rem;min-width:0}
.pick-today .pt-lbl{font-size:.74rem;color:rgba(255,255,255,.7)}
.pick-today b{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:1.08rem;line-height:1.25}
.pick-today .pt-sub{font-size:.8rem;color:rgba(255,255,255,.8)}
.pick-today .pt-note{font-size:.76rem;color:#E6D9A8}
.wine-card .thumb{position:relative}
.wine-badge{position:absolute;top:.6rem;left:.6rem;z-index:1;background:var(--wine);color:#fff;font-size:.68rem;font-weight:500;padding:.22rem .6rem;border-radius:99px}

/* estoque: lápis de correção */
.stock-ctrl{gap:.4rem}
.stock-ctrl .stock-input{width:60px;padding:.25rem .4rem;font-size:.88rem;text-align:center}
.stock-ctrl [data-setstock]{margin-left:.15rem;font-size:.82rem}
/* boas-vindas (versão organizada) */
.welcome{display:grid;gap:1.4rem;align-items:center;padding:1.7rem 1.4rem}
@media(min-width:760px){.welcome{grid-template-columns:1.15fr 1fr;gap:2.2rem;padding:2.2rem}}
.welcome-text .btn{padding:.85rem 1.6rem}
.pick-card{display:flex;gap:1rem;align-items:stretch;width:100%;padding:.85rem;text-align:left;color:var(--text);background:#fff;border-radius:var(--radius-lg);box-shadow:0 16px 30px -18px rgba(0,0,0,.55)}
.pick-card:hover{transform:translateY(-2px)}
.pick-card .pc-photo{flex:0 0 38%;max-width:132px;aspect-ratio:3/4;background:#fff;display:flex}
.pick-card .pc-photo img{width:100%;height:100%;object-fit:contain}
.pick-card .pc-info{display:flex;flex-direction:column;gap:.2rem;min-width:0;padding:.25rem .2rem .2rem 0}
.pick-card .pc-lbl{font-size:.74rem;color:var(--text-muted)}
.pick-card b{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:1.2rem;line-height:1.2}
.pick-card .pc-sub{font-size:.82rem;color:var(--text-muted)}
.pick-card .pc-price{font-weight:600;color:var(--wine);margin-top:.15rem}
.pick-card .pc-note{font-size:.76rem;color:var(--ink-soft)}
.pick-card .pc-cta{margin-top:auto;padding-top:.5rem;font-size:.84rem;font-weight:600;color:var(--wine);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--wine-line)}

/* rodapé: Instagram */
.cust-footer .ig-row{display:flex;justify-content:center;margin-bottom:.9rem}
.cust-footer .ig-link{display:inline-flex;align-items:center;gap:.5rem;font-size:.92rem;font-weight:500;color:var(--wine);text-decoration:none;border:1px solid var(--wine-line);border-radius:99px;padding:.55rem 1.1rem;background:var(--paper)}
.cust-footer .ig-link:hover{background:var(--wine-soft)}
.cust-footer .ig-link svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cust-footer .made-by{font-size:.78rem;color:var(--text-muted);margin-bottom:.8rem}
.cust-footer .made-by a{font-size:inherit;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.cust-footer .admin-link{display:inline-block;margin-top:.2rem}

/* ---------- Identidade visual Toca da Truta (Nytz, 2025) ----------
   Verde escuro #424228 · Musgo #9A9C74 · Terracota #9B5637 · Leão #B89F77 · Castanha #764D2D · Pérola #EDE1CB */
:root{
  --verde:#424228; --musgo:#9A9C74; --terracota:#9B5637; --leao:#B89F77; --castanha:#764D2D; --perola:#EDE1CB;
  --ink:#424228; --ink-soft:#5E4A33; --ink-faint:#9A8F78; --wine:#9B5637; --wine-soft:#F3E9D7; --wine-line:#DCCDAF;
  --bg:#EDE1CB; --paper:#F7F0E1; --panel:#F2E8D3; --surface:#F7F0E1; --surface-2:#E4D6B9;
  --line:#D9C8A6; --line-strong:#424228; --border:#D2BF99; --text:#3A2E1E; --text-muted:#7C6A4F; --ok:#6F7347;
  --shadow-card:0 1px 2px rgba(66,66,40,.08);
  --shadow-lift:0 22px 34px -20px rgba(66,50,30,.5);
  --shadow-modal:0 30px 60px -20px rgba(40,34,20,.6);
  --radius:14px; --radius-lg:22px;
}
body{background:var(--bg);color:var(--text)}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:0}
h2.serif,.modal-body h2,.rl-modal h2,.welcome h2{font-family:'Italiana','Cormorant Garamond',serif;font-weight:400;letter-spacing:.01em}
.wine-card h3,.rank-name,.rl-opt b,.pick-card b,.pick-today b{font-family:'Cormorant Garamond',serif;font-weight:600}
.wine-card h3{font-size:1.18rem}
input,select,textarea{background:var(--paper);border-color:var(--border);color:var(--text)}
input:focus,select:focus,textarea:focus{border-color:var(--terracota)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline-color:var(--terracota)}

/* cabeçalho: faixas listradas da marca + selo da truta */
.cust-header{background:rgba(237,225,203,.94);border-bottom:1px solid var(--line);padding-top:calc(1.5rem + 12px);position:sticky}
.cust-header::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;
  background:linear-gradient(var(--terracota) 0 4px,var(--perola) 4px 5px,var(--leao) 5px 7px,var(--perola) 7px 8px,var(--castanha) 8px 9px)}
.brand-row{align-items:flex-end}
.brand-row h1{font-family:'Italiana','Cormorant Garamond',serif;font-weight:400;font-size:2.3rem;line-height:1;letter-spacing:.01em;color:var(--verde)}
.brand-row h1>span:not(.eyebrow){font-style:normal;color:var(--terracota)}
.brand-row .eyebrow{display:flex;align-items:center;gap:.5rem;font-family:'Montserrat',sans-serif;font-style:normal;font-size:.62rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--castanha);margin-bottom:.55rem}
.brand-row .eyebrow i{font-style:normal;font-weight:500;letter-spacing:.2em;color:var(--leao);padding-left:.55rem;border-left:1px solid var(--leao)}
.fish{width:26px;height:26px;color:var(--verde);flex-shrink:0}
.count-tag{color:var(--castanha);letter-spacing:.14em;text-transform:uppercase;font-size:.68rem;font-weight:600}
.search-row input{background:var(--paper);border-color:var(--border)}
.filter-toggle,.tab-btn,.btn-outline{background:var(--paper);border-color:var(--border);color:var(--castanha)}
.filter-toggle:hover,.tab-btn:hover,.btn-outline:hover{border-color:var(--terracota);color:var(--terracota)}
.filter-toggle.active,.tab-btn.active,.country-tabs .tab-btn.active{background:var(--verde);border-color:var(--verde);color:var(--perola)}
.country-tabs .tab-btn{color:var(--text-muted);border-color:var(--line)}
.filters{background:var(--panel)}

/* botões */
.btn{background:var(--terracota);border-color:var(--terracota);color:var(--perola);box-shadow:0 8px 16px -10px rgba(155,86,55,.8);letter-spacing:.02em}
.btn:hover{background:var(--castanha);border-color:var(--castanha)}
.pair-btn{border-color:var(--verde);color:var(--verde)}
.pair-btn:hover,.pair-btn[aria-expanded=true]{background:var(--verde);color:var(--perola)}
.pair-text{border-color:var(--verde);background:var(--paper)}
.pair-pick label:has(input:checked){background:var(--verde);border-color:var(--verde);color:var(--perola)}

/* cartões */
.wine-card{background:var(--paper);border-color:var(--line);border-radius:22px}
.wine-card:hover{border-color:var(--musgo)}
.wine-card .thumb{background:linear-gradient(180deg,#F1E6CF,#E7D8B8);border-bottom:1px solid var(--line);border-radius:0 0 90px 90px / 0 0 28px 28px}
.wine-card .info{text-align:center}
.wine-card .price{color:var(--terracota);font-weight:600}
.cat-pill{background:rgba(154,156,116,.22);color:var(--verde);border-color:transparent;letter-spacing:.1em;text-transform:uppercase;font-size:.58rem;font-weight:600}
.wine-badge{background:var(--terracota);color:var(--perola);letter-spacing:.04em}
.wine-card .thumb img,.modal .hero img,.pick-card .pc-photo img,.pick-today img,.rank-item .rank-thumb,.row-thumb,.photo-pick img{mix-blend-mode:multiply}
.modal .hero,.pick-card .pc-photo,.pick-today img,.rank-item .rank-thumb,.row-thumb,.photo-pick img{background:#F1E6CF}

/* boas-vindas: verde profundo com truta em marca-d'água */
.welcome{background:var(--verde);color:var(--perola);position:relative;overflow:hidden;border-radius:26px}
.welcome::before{content:"";position:absolute;inset:auto -40px -50px auto;width:300px;height:300px;opacity:.09;pointer-events:none;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><g fill='none' stroke='%23EDE1CB' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 40c18-14 46-16 66 0 14 11 22 30 17 50-2 8-6 14-12 20'/><path d='M12 40c10 14 34 20 58 12'/><path d='M62 24c8-8 16-9 22-6-3 6-5 12-6 18'/><path d='M80 98c-10-2-18 2-24 10 10 6 22 4 30-4'/><path d='M46 56c-8 3-14 9-16 16 8-1 14-6 18-12'/></g></svg>") no-repeat center/contain}
.welcome>*{position:relative}
.welcome h2{font-size:2rem;color:var(--perola)}
.welcome p{color:rgba(237,225,203,.8)}
.welcome .btn,.rl-banner .btn,.rl-banner .btn-outline{background:var(--perola);color:var(--verde);border-color:var(--perola);box-shadow:none}
.welcome .btn:hover,.rl-banner .btn:hover,.rl-banner .btn-outline:hover{background:var(--leao);border-color:var(--leao);color:var(--verde)}
.pick-today{border-color:rgba(237,225,203,.28);background:rgba(237,225,203,.08)}
.pick-today .pt-note{color:var(--leao)}
.pick-card{background:var(--paper);border-radius:20px}
.pick-card .pc-price,.pick-card .pc-cta{color:var(--terracota)}
.pick-card .pc-cta{text-decoration-color:var(--leao)}
.rl-banner{background:var(--castanha);color:var(--perola);border-radius:26px}
.rl-banner p{color:rgba(237,225,203,.8)}

/* ranking */
.rank-list{border-top-color:var(--verde)}
.rank-item.top{background:var(--castanha);color:var(--perola)}
.rank-item.top .rank-pos{color:var(--leao)}
.rank-pos{color:var(--leao)}
.rank-bar{background:var(--surface-2)}
.rank-bar i{background:var(--terracota)}
.sale-btn{border-color:var(--terracota);color:var(--terracota)}
.sale-btn:hover{background:var(--terracota);color:var(--perola)}

/* roleta */
.rl-opt:hover{border-color:var(--terracota);background:var(--wine-soft)}
.rl-stage canvas{box-shadow:0 0 0 7px var(--leao),0 0 0 8px var(--castanha),var(--shadow-lift)}
.rl-stage.landed canvas{box-shadow:0 0 0 3px var(--perola),0 0 0 7px var(--terracota),var(--shadow-lift)}
.rl-pointer{border-top-color:var(--terracota)}
.rl-hub{background:var(--perola);border-color:var(--verde);box-shadow:0 2px 8px rgba(66,66,40,.35)}
.rl-row input{accent-color:var(--terracota)}
.rl-result .win{color:var(--verde);font-family:'Italiana','Cormorant Garamond',serif;font-weight:400;font-size:1.9rem}
.rl-result .lbl{color:var(--castanha)}

/* navegação inferior */
.cust-nav{background:rgba(237,225,203,.96);border-top:1px solid var(--line)}
.cust-nav .nav-item{color:var(--ink-faint)}
.cust-nav .nav-item.active,.cust-nav .nav-item:hover{color:var(--terracota)}
.cust-nav .nav-item.active span{border-bottom-color:var(--terracota)}

/* modais */
.modal-back{background:rgba(48,42,24,.78)}
.modal,.form-modal{background:var(--paper)}
.modal-price{color:var(--terracota)}
.spec-grid dt{letter-spacing:.1em;text-transform:uppercase;font-size:.64rem;font-weight:600;color:var(--castanha)}
.close-btn{background:rgba(66,66,40,.7);color:var(--perola)}
.close-btn:hover{background:var(--terracota)}
.dot{background:var(--musgo)}

/* rodapé */
.cust-footer{border-top:none;position:relative;padding-top:2.6rem}
.cust-footer::before{content:"";position:absolute;left:1.5rem;right:1.5rem;top:1rem;height:9px;
  background:linear-gradient(var(--terracota) 0 4px,var(--perola) 4px 5px,var(--leao) 5px 7px,var(--perola) 7px 8px,var(--castanha) 8px 9px)}
.cust-footer .ig-link{color:var(--verde);border-color:var(--musgo);background:var(--paper)}
.cust-footer .ig-link:hover{background:var(--musgo);color:var(--verde)}

/* painel admin */
.badge.on{background:var(--verde);border-color:var(--verde);color:var(--perola)}
.admin-nav{background:var(--panel)}
.admin-nav button.active{background:var(--verde);color:var(--perola)}
.stock-ctrl button:hover{background:var(--verde);border-color:var(--verde);color:var(--perola)}
.stat .n{color:var(--verde)}
th{background:var(--panel);color:var(--castanha)}

/* ---------- Ajustes: logotipo original, "Desde 1992" e destaque do ranking ---------- */
.brand-row h1{display:flex;flex-direction:column;align-items:flex-start;gap:.5rem;font-size:1rem;min-width:0}
.brand-row .logo{display:flex;align-items:center;gap:.55rem}
.fish-mark,.word-mark{display:block;background-color:var(--verde);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;flex-shrink:0}

function saveWine(w){setDoc(doc(winesColl,String(w.id)),w).catch(e=>{console.error('Erro ao salvar vinho no banco:',e);alert('Não consegui salvar "'+(w.name||'vinho')+'" no banco ('+(e.code||e.message)+'). Atualize a página e confira.');});}
/* A foto grande fica num documento separado (adega/img_ID). O vinho carrega só a miniatura, então o cardápio abre rápido. */
const fullImgCache={};
const imgRef=id=>doc(db,'adega','img_'+id);
async function loadFullImage(w){
  if(w.image)return w.image;
  if(fullImgCache[w.id])return fullImgCache[w.id];
  try{
    const sn=await getDoc(imgRef(w.id));
    const img=sn.exists()?(sn.data().image||''):'';
    if(img)fullImgCache[w.id]=img;
    return img||w.thumb||'';
  }catch(e){console.error('Erro ao carregar foto grande:',e);return w.thumb||'';}
}
function deleteWineDoc(id){return deleteDoc(doc(winesColl,String(id)));}
function nextId(){return wines.length?Math.max(...wines.map(w=>w.id))+1:1;}

let settings=structuredClone(DEFAULT_SETTINGS);
function saveSettings(){
  /* Grava só os campos conhecidos e já avisa na tela se o banco recusar (antes o erro ficava escondido e o item sumia sozinho). */
  const clean=JSON.parse(JSON.stringify({categories:settings.categories,priceRanges:settings.priceRanges,menu:settings.menu}));
  return setDoc(settingsRef,clean).catch(e=>{console.error('Erro ao salvar configurações no banco:',e);alert('Não consegui salvar as configurações no banco ('+(e.code||e.message)+'). A alteração pode sumir ao recarregar; confira as Regras do Firestore.');});
}

/* Tira o fundo liso da foto (inclusive moldura/quadrado bege) e deixa branco, para a garrafa se encaixar no cartão como as outras. */
function removePhotoBackground(d,W,H){
  const N=W*H, gone=new Uint8Array(N);
  const near=(i,c,tol)=>{const k=i*4,a=d[k]-c[0],b=d[k+1]-c[1],e=d[k+2]-c[2];return a*a+b*b+e*e<tol*tol;};

  const lum=c=>.299*c[0]+.587*c[1]+.114*c[2];
  const flood=(seeds,c,tol)=>{
    const st=[];
    for(const i of seeds){if(!gone[i]){gone[i]=1;st.push(i);}}
    while(st.length){
      const i=st.pop(),x=i%W,y=(i-x)/W;
      if(x>0&&!gone[i-1]&&near(i-1,c,tol)){gone[i-1]=1;st.push(i-1);}
      if(x<W-1&&!gone[i+1]&&near(i+1,c,tol)){gone[i+1]=1;st.push(i+1);}
      if(y>0&&!gone[i-W]&&near(i-W,c,tol)){gone[i-W]=1;st.push(i-W);}
      if(y<H-1&&!gone[i+W]&&near(i+W,c,tol)){gone[i+W]=1;st.push(i+W);}
    }
  };
  const TOL=44;
  /* passada 1: cor mais comum na borda da foto */
  let ring=[];
  for(let x=0;x<W;x++){ring.push(x);ring.push((H-1)*W+x);}
  for(let y=1;y<H-1;y++){ring.push(y*W);ring.push(y*W+W-1);}
  const pass=(ring,minArea)=>{
    const cs=[[],[],[]];
    for(const i of ring){if(gone[i])continue;const k=i*4;cs[0].push(d[k]);cs[1].push(d[k+1]);cs[2].push(d[k+2]);}
    if(cs[0].length<8)return false;
    const c=[med(cs[0]),med(cs[1]),med(cs[2])];
    if(lum(c)<150)return false;                       /* fundo escuro: não mexe */
    const seeds=ring.filter(i=>!gone[i]&&near(i,c,TOL));
    if(seeds.length<ring.length*0.85)return false;    /* borda não é lisa: não é um fundo uniforme */
    flood(seeds,c,TOL);
    return true;
  };
  if(!pass(ring))return false;
  /* passadas extras: moldura dupla (quadrado de outra cor dentro do fundo) */
  for(let n=0;n<2;n++){
    let x0=W,y0=H,x1=-1,y1=-1;
    for(let i=0;i<N;i++){if(!gone[i]){const x=i%W,y=(i-x)/W;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}}
    if(x1<0||(x1-x0+1)*(y1-y0+1)<N*0.2)break;
    const r=[];
    for(let x=x0;x<=x1;x++){r.push(y0*W+x);r.push(y1*W+x);}
    for(let y=y0+1;y<y1;y++){r.push(y*W+x0);r.push(y*W+x1);}
    if(!pass(r))break;
  }
  let cnt=0;for(let i=0;i<N;i++)cnt+=gone[i];
  if(cnt>N*0.93)return false;                         /* tirou demais: algo deu errado */
  for(let i=0;i<N;i++){if(gone[i]){const k=i*4;d[k]=d[k+1]=d[k+2]=255;d[k+3]=255;}}
  return true;
}
function drawStandardPhoto(img,maxDim,quality){
  const H=maxDim, W=Math.round(maxDim*3/4), pad=Math.round(H*0.06);
  const scale=Math.min((W-pad*2)/img.width,(H-pad*2)/img.height);
  const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
  const canvas=document.createElement('canvas');
  canvas.width=W;canvas.height=H;
  const c=canvas.getContext('2d');
  c.fillStyle='#FFFFFF';c.fillRect(0,0,W,H);
  c.imageSmoothingQuality='high';
  let src=img;
  try{
    const t=document.createElement('canvas');t.width=w;t.height=h;
    const tc=t.getContext('2d',{willReadFrequently:true});
    tc.fillStyle='#FFFFFF';tc.fillRect(0,0,w,h);
    tc.imageSmoothingQuality='high';
    tc.drawImage(img,0,0,w,h);
    const id=tc.getImageData(0,0,w,h);
    if(removePhotoBackground(id.data,w,h)){tc.putImageData(id,0,0);src=t;}
  }catch(e){/* foto de outro site ou sem permissão: usa como está */}
  if(src===img)c.drawImage(img,Math.round((W-w)/2),Math.round((H-h)/2),w,h);
  else c.drawImage(src,Math.round((W-w)/2),Math.round((H-h)/2));
  return canvas.toDataURL('image/jpeg',quality);
}
/* Padroniza uma foto que já está salva (data URL ou link) na tela 3:4 com fundo branco. */
function standardizeSrc(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    if(!String(src).startsWith('data:'))img.crossOrigin='anonymous';
    img.onerror=()=>reject(new Error('Não foi possível carregar a foto.'));
    img.onload=()=>{
      try{resolve({image:drawStandardPhoto(img,1000,0.82),thumb:drawStandardPhoto(img,420,0.7)});}
      catch(e){reject(e);}
    };
    img.src=src;
  });
}
function resizeImage(file,maxDim,quality){
  /* maxDim = altura da tela padrão 3:4 (largura = 75%). A foto inteira é encaixada no centro, sobre fundo branco, sem cortar a garrafa. */
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('Não foi possível ler o arquivo.'));
    reader.onload=e=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('Arquivo não é uma imagem válida.'));
      img.onload=()=>{
        resolve(drawStandardPhoto(img,maxDim,quality));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* Mantém o app sincronizado em tempo real: qualquer alteração feita em um aparelho aparece nos outros.
   Sem migração automática — o Firestore às vezes entrega um instantâneo vazio do cache local antes do
   dado real chegar, e migrar nesse momento sobrescreve vinhos reais com os padrões. */
onSnapshot(winesColl,snap=>{
  if(snap.empty&&snap.metadata.fromCache)return; /* espera o dado real do servidor */
  wines=snap.docs.map(d=>d.data());
  winesLoaded=true;checkReady();route();
},err=>{console.error('Erro ao carregar vinhos do banco:',err);dbError=err.code||err.message;route();});

onSnapshot(settingsRef,snap=>{
  if(snap.exists()){
    const d=snap.data();
    settings={
      categories:Array.isArray(d.categories)&&d.categories.length?d.categories:structuredClone(DEFAULT_SETTINGS.categories),
      priceRanges:Array.isArray(d.priceRanges)&&d.priceRanges.length?d.priceRanges:structuredClone(DEFAULT_SETTINGS.priceRanges),
      menu:Array.isArray(d.menu)&&d.menu.length?d.menu:structuredClone(DEFAULT_SETTINGS.menu),
    };
  }else{if(snap.metadata.fromCache)return; /* ainda não confirmado pelo servidor: não sobrescreve com os padrões */
    settings=structuredClone(DEFAULT_SETTINGS);setDoc(settingsRef,settings).catch(e=>console.error('Erro ao criar configurações iniciais:',e));}
  settingsLoaded=true;checkReady();route();
},err=>{console.error('Erro ao carregar configurações do banco:',err);dbError=err.code||err.message;route();});

function checkReady(){if(winesLoaded&&settingsLoaded)dbReady=true;}

/* ---------------- routing ---------------- */
function route(){
  if(!location.hash){
    /* Sem endereço definido ainda: computador entra direto nas configurações, celular/tablet no cardápio. */
    history.replaceState(null,'',IS_DESKTOP?'#admin':'#catalogo');
  }
  const isAdmin=location.hash.startsWith('#admin');
  document.getElementById('customer').classList.toggle('hide',isAdmin);
  document.getElementById('admin').classList.toggle('hide',!isAdmin);
  if(dbError){
    document.getElementById(isAdmin?'admin':'customer').innerHTML=`<div style="padding:5rem 1.5rem;text-align:center;color:var(--text-muted);max-width:520px;margin:0 auto">
      <p style="color:var(--ink);font-weight:600;margin-bottom:.6rem">Não foi possível conectar ao banco de dados.</p>
      <p style="font-size:.85rem;margin-bottom:.6rem">Erro: ${dbError}</p>
      <p style="font-size:.85rem">Verifique se as Regras do Firestore foram salvas e publicadas no console do Firebase.</p>
    </div>`;
    return;
  }
  if(!dbReady){
    document.getElementById(isAdmin?'admin':'customer').innerHTML='<div style="padding:5rem 1.5rem;text-align:center;color:var(--text-muted)">Carregando…</div>';
    return;
  }
  if(isAdmin){renderAdmin();}else{renderCustomer();}
}

function wineDishes(w){
  const ids=Array.isArray(w.dishes)?w.dishes:[];
  return (settings.menu||[]).filter(d=>ids.includes(d.id));
}
/* Sugestão inicial pelo estilo do vinho x pratos da casa (o admin pode ajustar em "editar"). */
function suggestDishes(w){
  const norm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const c=norm(w.category), g=norm(w.grape);
  const has=(...k)=>k.some(x=>g.includes(x));
  let ids=[];
  if(c.includes('espumante'))ids=['pate','antepasto','conquilha','salada','arroz','fettuccine'];
  else if(c.includes('rose'))ids=['pate','antepasto','salada','abobora','pico','risoto','arroz','fit'];
  else if(c.includes('branco')){
    if(has('chardonnay','viognier','chenin','marsanne','roussanne'))ids=['conquilha','abobora','caparao','fettuccine','pico','risoto'];
    else if(has('sauvignon','riesling','albarino','viosinho','grigio','verdejo','vinho verde','loureiro','arinto','gruner','trebbiano','fiano'))ids=['pate','antepasto','salada','arroz','fit','risoto','caparao'];
    else ids=['pate','antepasto','conquilha','caparao','arroz','fettuccine','fit'];
  }
  else if(c.includes('tinto')){
    if(has('pinot noir','gamay','sangiovese','grenache','garnacha','merlot','tempranillo'))ids=['abobora','pico','caparao','risoto'];
    else ids=['abobora'];
  }
  const have=new Set((settings.menu||[]).map(d=>d.id));
  return ids.filter(x=>have.has(x));
}
/* Busca tolerante: ignora acento/maiúscula e procura em nome, país, região, uva e categoria. Várias palavras = todas precisam aparecer. */
const normSearch=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
function wineMatches(w,q){
  const terms=normSearch(q).split(/\s+/).filter(Boolean);
  if(!terms.length)return true;
  const hay=normSearch([w.name,w.country,w.region,w.grape,w.category].join(' '));
  return terms.every(t=>hay.includes(t));
}
function filteredWines(){
  const s=custState;
  return availableWines().filter(w=>{
    if(s.q&&!wineMatches(w,s.q))return false;
    if(s.category&&w.category!==s.category)return false;
    if(s.country&&w.country!==s.country)return false;
    if(s.grape&&w.grape!==s.grape)return false;
    if(s.min&&w.price<Number(s.min))return false;
    if(s.max&&w.price>Number(s.max))return false;
    return true;
  });
}

let revealObs=null;
function observeCards(scope){
  const cards=scope.querySelectorAll('.wine-card:not(.in)');
  if(!('IntersectionObserver' in window)){cards.forEach(c=>c.classList.add('in'));return;}
  if(!revealObs){
    revealObs=new IntersectionObserver(es=>{
      es.forEach(e=>{
        if(e.isIntersecting){
          const c=e.target;
          c.style.transitionDelay=(Number(c.dataset.ri||0)*70)+'ms';
          c.classList.add('in');
          revealObs.unobserve(c);
        }
      });
    },{threshold:.08,rootMargin:'0px 0px -6% 0px'});
  }
  cards.forEach((c,i)=>{c.classList.add('reveal');c.dataset.ri=i%3;revealObs.observe(c);});
}
function bindWineCards(scope){
  observeCards(scope);
  scope.querySelectorAll('.wine-card').forEach(c=>{
    c.onclick=()=>openWineModal(Number(c.dataset.id));
    c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openWineModal(Number(c.dataset.id));}};
  });
}

/* ---------- Otimização automática das fotos ----------
   Roda sozinha, em segundo plano, quando a equipe abre a área administrativa.
   Separa a foto grande da ficha do vinho e cria a miniatura leve; vinhos já otimizados são ignorados.
   O aviso fica numa faixa fixa na tela, que não some quando o painel é redesenhado. */
const photoJob={started:false,running:false,done:0,total:0,failed:{}};
function photoChip(text,{err=false,autoHide=0}={}){
  let c=document.getElementById('photoChip');
  if(!text){if(c)c.remove();return;}
  if(!c){
    c=document.createElement('div');c.id='photoChip';
    c.style.cssText='position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9000;max-width:92vw;padding:.65rem 1rem;border-radius:99px;font-size:.82rem;background:#424228;color:#EDE1CB;box-shadow:0 10px 24px -10px rgba(0,0,0,.5);display:flex;gap:.7rem;align-items:center';
    document.body.appendChild(c);
  }
  c.style.background=err?'#8A2E2E':'#2F3D2B';
  c.innerHTML='<span></span><button aria-label="Fechar" style="color:#fff;opacity:.8">✕</button>';
  c.firstChild.textContent=text;
  c.querySelector('button').onclick=()=>c.remove();
  clearTimeout(c._t); if(autoHide)c._t=setTimeout(()=>c.remove(),autoHide);
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function optimizeOnePhoto(id){
  const w=wines.find(x=>x.id===id);
  if(!w||!String(w.image||'').startsWith('data:'))return; /* já otimizado (talvez por outro aparelho) */
  const r=await standardizeSrc(w.image);
  await setDoc(imgRef(id),{image:r.image});                     /* 1º guarda a foto grande */
  await updateDoc(doc(winesColl,String(id)),{image:'',thumb:r.thumb,photoStd:true,imgSplit:true}); /* 2º só então limpa a ficha */
  fullImgCache[id]=r.image;
}
async function optimizePhotosAuto(){
  if(photoJob.running)return;
  const pending=()=>wines.filter(w=>String(w.image||'').startsWith('data:')&&!photoJob.failed[w.id]).map(w=>w.id);
  const ids=pending();
  if(!ids.length)return;
  photoJob.running=true;photoJob.done=0;photoJob.total=ids.length;
  for(const id of ids){
    const name=(wines.find(x=>x.id===id)||{}).name||('#'+id);
    photoChip(`Otimizando fotos para o cardápio abrir mais rápido… ${photoJob.done+1} de ${photoJob.total}`);
    let lastErr=null;
    for(let t=0;t<3;t++){
      try{await optimizeOnePhoto(id);lastErr=null;break;}
      catch(e){lastErr=e;console.error('Falha ao otimizar',name,'(tentativa '+(t+1)+')',e);await sleep(1200*(t+1));}
    }
    if(lastErr)photoJob.failed[id]={name,error:lastErr.code||lastErr.message||String(lastErr)};
    else photoJob.done++;
    await sleep(120);
  }
  photoJob.running=false;
  const bad=Object.values(photoJob.failed);
  if(bad.length)photoChip(`${photoJob.done} foto(s) otimizada(s). ${bad.length} não deu certo: ${bad.map(b=>b.name+' ('+b.error+')').join(', ')}`,{err:true});
  else photoChip(`Pronto: ${photoJob.done} foto(s) otimizada(s). O cardápio já abre mais rápido.`,{autoHide:6000});
}
function maybeAutoOptimize(){
  if(photoJob.started||!adminAuthed||!dbReady)return;
  photoJob.started=true;
  setTimeout(optimizePhotosAuto,1500); /* espera o painel terminar de carregar */
}
